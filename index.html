<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="star.css" />
  </head>
  <body>
    <script>
      let reverseGravity = false;
      let reverseMomentum = false;

      function movingStar() {
        let star = document.getElementById("star").style;
        let top = parseInt(star.marginTop) || 10;
        let left = parseInt(star.marginLeft) || 59;

        if (top >= 370) {
          reverseGravity = true;
        } else if (top <= 10) {
          reverseGravity = false;
        }

        if (reverseGravity) {
          star.marginTop = top - 10 + "px";
        } else {
          star.marginTop = top + 10 + "px";
        }

        if (left >= 1150) {
          reverseMomentum = true;
        } else if (left <= 59) {
          reverseMomentum = false;
        }

        if (reverseMomentum) {
          star.marginLeft = left - 5 + "px";
        } else {
          star.marginLeft = left + 5 + "px";
        }
      }
        setInterval(movingStar, 50);
    </script>
    <h1>Star moving!!!!!!</h1>
    <div id="star">
      <img src="star.png" alt="Star*" />
    </div>
  </body>
</html>
