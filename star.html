<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="star.css" />
  </head>
  <body>
    <script>
      let reverseGravity = false;
      let reverseMomentum = false;

      function movingStar() {
        let star = document.getElementById("star").style;
        let top = parseInt(star.marginTop) || 30;
        let left = parseInt(star.marginLeft) || 99;

        if (top >= 350) {
          reverseGravity = true;
        } else if (top <= 30) {
          reverseGravity = false;
        }

        if (reverseGravity) {
          star.marginTop = top - 10 + "px";
        } else {
          star.marginTop = top + 10 + "px";
        }

        if (left >= 1120) {
          reverseMomentum = true;
        } else if (left <= 99) {
          reverseMomentum = false;
        }

        if (reverseMomentum) {
          star.marginLeft = left - 5 + "px";
        } else {
          star.marginLeft = left + 5 + "px";
        }
        setInterval(movingStar, 200);
      }
    </script>
    <h1>Push button to move star</h1>
    <button type="button" onclick="movingStar()">Star moving!!!!!</button>
    <div id="star">
      <img src="Biggest star.png" alt="Star*" />
    </div>
  </body>
</html>
